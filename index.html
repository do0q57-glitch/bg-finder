<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<title>배경 소재 파인더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: store-style — sticky header (logo + search + 대분류 tabs), left tag rail, product grid; detail opens in a modal */
:root{
  --bg:#ffffff; --soft:#f5f6f8; --ink:#1d1d1f; --muted:#7a7d85; --faint:#a3a6ad; --line:#e6e7ea;
  --accent:#4a4af4; --accent-ink:#ffffff; --accent-soft:#eeeeff; --warn:#c2410c; --shade:rgba(10,12,20,.55);
  --c-N:#2f8a5b; --c-E:#b0322b; --c-F:#6d45c9; --c-M:#2b6fa8;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317; --soft:#1b1d22; --ink:#ececf0; --muted:#9a9ea8; --faint:#6d717a; --line:#2b2e35;
  --accent:#8d8dff; --accent-ink:#0f1030; --accent-soft:#25264d; --warn:#fb923c; --shade:rgba(0,0,0,.7);
  --c-N:#5cc08c; --c-E:#e5726a; --c-F:#b392ec; --c-M:#6fb0e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --soft:#1b1d22; --ink:#ececf0; --muted:#9a9ea8; --faint:#6d717a; --line:#2b2e35;
  --accent:#8d8dff; --accent-ink:#0f1030; --accent-soft:#25264d; --warn:#fb923c; --shade:rgba(0,0,0,.7);
  --c-N:#5cc08c; --c-E:#e5726a; --c-F:#b392ec; --c-M:#6fb0e6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1440px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.hd1{display:flex;align-items:center;gap:20px;padding-block:14px 8px}
.logo{display:flex;align-items:baseline;gap:6px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0;flex:none}
.logo b{font-weight:900;font-size:24px;letter-spacing:-.04em}
.logo span{font-size:12px;color:var(--muted);font-weight:500}
.sbox{position:relative;flex:1;max-width:560px}
.sbox input{width:100%;font:inherit;font-size:14px;padding:11px 44px 11px 16px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.sbox input:focus{outline:none;border-color:var(--accent)}
.sbox .ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;pointer-events:none;color:var(--ink)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:12;max-height:60vh;overflow:auto}
.sugg h4{margin:6px 10px 2px;font-size:11px;color:var(--faint);font-weight:500}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.sugg button:hover,.sugg button.on{background:var(--soft)}
.sugg small{color:var(--faint);flex:none}
.nasbtn{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:nowrap}.nasbtn:hover{border-color:var(--ink)}@media(max-width:760px){.hstat{display:none}}
.hdr{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);flex:none}
.nav{display:flex;gap:4px 26px;align-items:center;flex-wrap:wrap;padding-block:6px 0}
.nav button{border:0;background:none;padding:8px 0 10px;font-size:16px;font-weight:700;cursor:pointer;border-bottom:2.5px solid transparent;color:var(--ink)}
.nav button[aria-current="true"]{color:var(--accent);border-color:var(--accent)}
.nav .sep{width:1px;height:16px;background:var(--line)}
.nav .sub{font-size:14px;font-weight:500;color:var(--muted)}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:5px 12px;font-size:12.5px;cursor:pointer;border-bottom:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:720px){.hd1{flex-wrap:wrap}.sbox{order:3;flex-basis:100%;max-width:none}.hdr{display:none}.nav button{font-size:15px}.seg{margin-left:0}}
/* body layout */
.body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding-block:22px 60px}
@media (max-width:900px){.body{grid-template-columns:minmax(0,1fr)}}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);align-self:start;max-height:calc(100vh - 150px);overflow:auto;padding-right:4px}
@media (max-width:900px){aside{position:static;max-height:none}}
.mode{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.mode button{font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:2px 8px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.grp{border-bottom:1px solid var(--line);padding-block:12px}
details.grp summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-size:14px;font-weight:700}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"⌄";color:var(--muted);transition:transform .15s}
details.grp[open] summary::after{transform:rotate(180deg)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.75}
.chip:disabled{opacity:.35;cursor:default}
/* home */
.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:34px}
@media (max-width:900px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--soft);text-align:left}
.cat .im{position:absolute;inset:0;overflow:hidden}
.cat .im img{position:absolute;left:0;top:0;width:100%}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.72))}
.cat .tx{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff}
.cat .tx b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em}
.cat .tx span{font-size:12.5px;opacity:.9}
@media (prefers-reduced-motion:no-preference){.cat .im{transition:transform .25s}.cat:hover .im{transform:scale(1.04)}}
h2.sec{font-size:20px;font-weight:700;margin:0 0 14px;letter-spacing:-.02em}
h2.sec em{font-style:normal;color:var(--accent)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer}
.circles{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}
.circ{flex:none;border:0;background:none;padding:0;cursor:pointer;display:grid;justify-items:center;gap:6px;width:74px;font-size:12px;color:var(--ink)}
.circ .ring{width:64px;height:64px;border-radius:50%;overflow:hidden;position:relative;background:var(--soft);border:2px solid transparent}
.circ[aria-pressed="true"] .ring{border-color:var(--accent)}
.circ[aria-pressed="true"]{color:var(--accent);font-weight:700}
.circ .ring img{position:absolute;top:0;left:50%;transform:translateX(-50%);max-width:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:16px}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--ink)}
.active{display:flex;flex-wrap:wrap;gap:5px}
.reset{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:2px}
.sort{margin-left:auto;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.focus{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.focus b{font-size:16px}
.focus p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
/* product grid */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 16px}
.shot{display:grid;gap:3px;align-content:start;cursor:pointer;border:0;background:none;padding:0;text-align:left;min-width:0;color:inherit;font:inherit}
.shot .thumb{margin-bottom:6px}.shot:hover .thumb{outline:2px solid var(--accent);outline-offset:2px}
.shot b{font-size:14px;font-weight:500;overflow-wrap:anywhere}.shot span{font-size:12px;color:var(--muted)}
.bx{position:absolute;border:2px solid #ffd400;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.55);pointer-events:none}
.propchips{display:flex;flex-wrap:wrap;gap:8px}.propchips .chip{font-size:13.5px;padding:6px 13px}
.propban{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.propban .btn{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 18px}
.card{display:grid;gap:4px;align-content:start;cursor:pointer;border:0;background:none;padding:0;text-align:left;min-width:0}
.thumb{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:6px;overflow:hidden;background:var(--soft);margin-bottom:8px}
.thumb img{position:absolute;left:0;top:0;width:100%}
.thumb img.full{height:100%;object-fit:cover}
.thumb .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px}
.badge{position:absolute;left:8px;top:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
.badge.up{left:auto;right:8px;background:#111}
@media (prefers-reduced-motion:no-preference){.thumb img{transition:transform .25s}.card:hover .thumb img.full{transform:scale(1.04)}}
.by{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.by span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.by i{font-style:normal;color:var(--cat);font-weight:700;flex:none}
.card h3{margin:0;font-size:15px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:nowrap;gap:4px;overflow:hidden;margin-top:4px}
.pill{flex:none;font-size:11px;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:1px 8px}
.pill.hit{border-color:var(--accent);color:var(--accent)}
.stat{font-size:11.5px;color:var(--faint);display:flex;gap:10px;margin-top:2px}
.loadmore{display:flex;justify-content:center;margin-top:30px}
.btn{font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--warn)}
.empty{padding:50px 16px;text-align:center;color:var(--muted);background:var(--soft);border-radius:10px}
/* detail modal */
.ov{position:fixed;inset:0;z-index:30;background:var(--shade);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--bg);border-radius:12px;width:min(1080px,100%);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;padding:24px;position:relative}
@media (max-width:820px){.dlg{grid-template-columns:minmax(0,1fr);padding:16px}}
.x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:6px}
.big{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:8px;overflow:hidden;background:var(--soft)}
.big img{position:absolute;left:0;top:0;width:100%}
.big img.full{height:100%;object-fit:contain;background:var(--soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.thumbs button{position:relative;aspect-ratio:16/10;max-width:100%;padding:0;border:2px solid transparent;border-radius:5px;overflow:hidden;cursor:pointer;background:var(--soft)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{position:absolute;left:0;top:0;width:100%}
.thumbs img.full{height:100%;object-fit:cover}
.info{display:grid;gap:12px;align-content:start;min-width:0}
.info .set{font-size:13px;color:var(--muted)}
.info .set button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.info h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.info .pills{flex-wrap:wrap}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{font:inherit;cursor:pointer;font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--ink)}
.links a.pri,.links button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tools{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.sib h4{margin:6px 0 8px;font-size:13px}
.sibs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sibs button{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-size:12px;display:grid;gap:4px;min-width:0}
.sibs .thumb{margin:0}
.sibs button[aria-current="true"] span{color:var(--accent);font-weight:700}
.nasrow{display:flex;gap:8px;align-items:center;margin-top:4px}.nasrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--mono);font-size:12px;background:var(--soft);padding:6px 8px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:40;max-width:90vw}
</style>

<div class="hd gut"><div class="in">
  <div class="hd1">
    <button type="button" class="logo" data-go="home" aria-label="홈으로"><b>BG FINDER</b><span>배경 소재 파인더</span></button>
    <div class="sbox">
      <input id="q" type="search" autocomplete="off" placeholder="모델링·소재 이름이나 태그로 검색 (예: 욕실, 감옥, 벚꽃, 로판)" aria-label="검색">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <div class="hdr" id="hdr"></div>
  </div>
  <nav class="nav" id="nav" aria-label="대분류"></nav>
</div></div>

<div class="gut"><div class="in body">
  <aside aria-label="태그 필터">
    <div class="mode">태그 조합
      <button id="m-and" aria-pressed="true" type="button">모두 포함</button>
      <button id="m-or" aria-pressed="false" type="button">하나라도</button>
    </div>
    <div id="filters"></div>
  </aside>
  <main id="main"></main>
</div></div>
<div class="ov" id="ov" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" id="dlg"></div></div>
<input type="file" id="fileIn" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>

const propMatch=w=>w?PL.filter(x=>x.keys.some(k=>k.includes(w)||(w.length>1&&w.includes(k)&&k.length>1))):[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const toast=t=>{const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,3200)};
const norm=s=>String(s).toLowerCase().replace(/\s+/g,"");

/* ---------- photos ---------- */
function photoList(u){
  const ph=photos[u.key]||{};const out=(ph.ids||[]).map(id=>({blob:id}));
  if(!ph.hide){
    if(u.it){const it=u.it;
      if(u.tl.length)u.tl.forEach(([c,k])=>out.push({file:`h/${u.i}_${c}.jpg`,n:it.hl[c],k,lab:"노션"}));
      else if(it.img)[...it.img].forEach((s,k)=>out.push({file:`img/${it.id}.jpg`,n:it.img.length,k,lab:s==="n"?"노션":"판매처"}));
    }else{[...(u.img||"")].forEach((s,k)=>out.push({file:`img/${u.id}.jpg`,n:u.img.length,k,lab:s==="n"?"노션":"판매처"}));
      u.models.slice(0,8).forEach(m=>{if(m.tl.length){const [c,k]=m.tl[0];out.push({file:`h/${u.id}_${c}.jpg`,n:u.hl[c],k,lab:"노션"})}})}
  }
  return out}
function cardPhoto(u){
  const ph=photos[u.key]||{};if((ph.ids||[]).length)return {blob:ph.ids[0]};
  if(ph.hide)return null;
  if(u.it){if(u.ci>=0)return {file:`m/${u.i}.jpg`,n:u.it.mc,k:u.ci};const it=u.it;return it.img?{file:`img/${it.id}.jpg`,n:it.img.length,k:0}:null}
  if(u.img)return {file:`img/${u.id}.jpg`,n:u.img.length,k:0};
  return u.mc?{file:`m/${u.id}.jpg`,n:u.mc,k:0}:null}
const tileImg=(p,alt="",lazy=true)=>p.blob?`<img class="full" src="/_blob/${esc(p.blob)}" alt="${esc(alt)}"${lazy?' loading="lazy"':""}>`
  :`<img src="${p.file}" alt="${esc(alt)}"${lazy?' loading="lazy"':""} style="height:${p.n*100}%;transform:translateY(-${p.k*100/p.n}%)">`;

/* ---------- filtering ---------- */
const pool=()=>view==="model"?models:items;
function hay(u){const it=u.it||u;return norm([u.n,it.n,it.b,it.d,...u.e,...u.g,...u.m,...u.t,...u.s,CATS[u.cc]].join(" "))}
models.forEach(m=>m._h=hay(m));items.forEach(i=>i._h=hay(i));
function matches(u,skip){
  if(cat&&u.cc!==cat)return false;
  if(focus!==null&&(u.it?u.i:u.id)!==focus)return false;
  if(q){const ws=q.trim().toLowerCase().split(/\s+/).map(norm).filter(Boolean);if(!ws.every(w=>u._h.includes(w)))return false}
  for(const g of GROUPS){if(g.k===skip)continue;const s=sel[g.k];if(!s.size)continue;const vals=u[g.k];
    const ok=(mode==="and"&&!["s","f"].includes(g.k))?[...s].every(v=>vals.includes(v)):[...s].some(v=>vals.includes(v));
    if(!ok)return false}
  return true}
function sorted(list){
  if(sort==="name")return [...list].sort((a,b)=>a.n.localeCompare(b.n,"ko"));
  if(sort==="img")return [...list].sort((a,b)=>(b.tot??b.k??0)-(a.tot??a.k??0));
  if(sort==="new")return [...list].sort((a,b)=>(b.it?b.i:b.id)-(a.it?a.i:a.id));
  return list}

/* ---------- render ---------- */

  $("#nav").innerHTML=`<button type="button" data-go="home" aria-current="${home&&!cat}">홈</button><button type="button" data-go="all" aria-current="${!home&&!cat}">전체</button><span class="sep"></span>${CORDER.map(c=>`<button type="button" data-go="${c}" aria-current="${cat===c}">${CATS[c]}</button>`).join("")}

  $("#hdr").innerHTML=`<span class="hstat">노션 동기화 ${SYNCED} · 소재 ${items.length} · 모델링 ${models.length}</span><a class="nasbtn" href="${nasUrl()}" target="_blank" rel="noopener" title="회사 NAS 계정으로 로그인한 사람만 열 수 있어요">🔒 NAS 소재 폴더</a>`;
}
function renderFilters(){
  const box=$("#filters");
  if(!box.dataset.built){box.innerHTML=GROUPS.map(g=>`<details class="grp" ${g.open?"open":""}><summary>${g.label}</summary><div class="chips" id="g-${g.k}"></div></details>`).join("");box.dataset.built=1}
  GROUPS.forEach(g=>{const p=pool().filter(u=>matches(u,g.k));
    document.getElementById("g-"+g.k).innerHTML=g.order.map(v=>{const n=p.filter(u=>u[g.k].includes(v)).length;const on=sel[g.k].has(v);
      return `<button type="button" class="chip" data-g="${g.k}" data-v="${esc(v)}" aria-pressed="${on}" ${!n&&!on?"disabled":""}>${esc(g.fmt?g.fmt(v):v)}<span class="n">${n}</span></button>`}).join("")})}
function cover(c){const it=items.find(x=>x.cc===c&&x.img&&x.img[0]!=="n"&&x.f.includes("3D"))||items.find(x=>x.cc===c&&x.img);return it?`<img src="img/${it.id}.jpg" alt="" style="height:${it.img.length*100}%">`:""}
function card(u){
  const it=u.it||u;const p=cardPhoto(u);const hit=(k,v)=>sel[k].has(v)?" hit":"";
  const pills=[...u.e.slice(0,3).map(v=>["e",v]),...u.m.slice(0,2).map(v=>["m",v]),...u.g.slice(0,1).map(v=>["g",v])].map(([k,v])=>`<span class="pill${hit(k,v)}">${esc(v)}</span>`).join("");
  const fmt=it.f[0]==="2D"?"2D":it.f[0]||"";
  return `<button type="button" class="card" style="--cat:var(--c-${it.cc})" data-open="${u.key}">
    <div class="thumb">${p?tileImg(p,u.n):`<span class="none">미리보기 없음</span>`}${fmt?`<span class="badge">${esc(fmt)}</span>`:""}${(photos[u.key]?.ids||[]).length?`<span class="badge up">직접 올림</span>`:""}</div>
    <div class="by"><i>${CATS[it.cc]}</i><span>${u.it?esc(it.n):esc(u.s[0])}</span></div>
    <h3>${esc(u.n)}</h3>
    <div class="pills">${pills}</div>
    <div class="stat">${u.it?`<span>이미지 ${u.tot}</span><span>${esc(u.s[0])}</span>`:`<span>모델링 ${it.models.length}</span><span>이미지 ${it.k}</span>`}</div>
  </button>`}
function renderHome(){
  const pick=[49,23,60,110,93,35,114,84,66,19,122,73].map(i=>items[i]).filter(Boolean);
  return `<section><div class="hero">${CORDER.map(c=>`<button type="button" class="cat" data-go="${c}"><div class="im">${cover(c)}</div><div class="tx"><b>${CATS[c]}</b><span>소재 ${items.filter(i=>i.cc===c).length}개 · 모델링 ${models.filter(m=>m.cc===c).length}개</span></div></button>`).join("")}</div></section>
  ${PL.length?`<section><h2 class="sec">소품으로 <em>장면 찾기</em></h2><div class="propchips">${[...PL].filter(x=>!["건물","나무","사람","창문","문","동물"].includes(x.ko)).sort((a,b)=>b.h.length-a.h.length).slice(0,28).map(x=>`<button type="button" class="chip" data-prop="${x.i}">${esc(x.ko)}<span class="n">${x.h.length}</span></button>`).join("")}</div></section>`:""}
  <section><h2 class="sec">많이 쓰는 <em>배경 세트</em></h2><div class="grid">${pick.map(it=>card(it)).join("")}</div></section>
  <div class="loadmore"><button type="button" class="btn pri" data-go="all">전체 모델링 ${models.length}개 보기</button></div>`}
function renderList(){
  const list=sorted(pool().filter(u=>matches(u)));
  const genreCirc=cat?GROUPS[1].order.map(g=>{const its=items.filter(i=>i.cc===cat&&i.g.includes(g)&&i.img);if(!its.length)return"";const it=its[0];
     return `<button type="button" class="circ" data-g="g" data-v="${esc(g)}" aria-pressed="${sel.g.has(g)}"><span class="ring"><img src="img/${it.id}.jpg" alt="" style="height:${it.img.length*100}%;width:auto"></span>${esc(g)}</button>`}).join(""):"";
  const act=GROUPS.flatMap(g=>[...sel[g.k]].map(v=>`<button type="button" class="chip" aria-pressed="true" data-g="${g.k}" data-v="${esc(v)}">${esc(g.fmt?g.fmt(v):v)} ✕</button>`));
  const fo=focus!==null?items[focus]:null;
  return `<div class="crumb"><button type="button" data-go="home">홈</button> › ${cat?CATS[cat]:"전체"}${fo?" › "+esc(fo.n):""}</div>
  <h2 class="sec">${q?`'<em>${esc(q)}</em>' 검색 결과`:cat?CATS[cat]:"전체 배경"}</h2>
  ${(()=>{const P=q&&propFind(norm(q));return P?`<div class="propban">🔍 '${esc(P.ko)}'가 보이는 스크린샷 <b>${P.h.length}</b>장이 있어요<button type="button" class="btn pri" data-prop="${P.i}">장면으로 보기</button></div>`:""})()}
  ${genreCirc?`<div class="circles">${genreCirc}</div>`:""}
  ${fo?`<div class="focus" style="--cat:var(--c-${fo.cc})"><div><b>${esc(fo.n)}</b><p>${CATS[fo.cc]} · 모델링 ${fo.models.length}개 · ${esc(fo.d)}</p></div><div class="links"><a href="https://gleecompany.notion.site/${fo.p}" target="_blank" rel="noopener">노션 상세 ↗</a><button type="button" class="btn" id="unfocus">세트 묶음 해제</button></div></div>`:""}
  <div class="toolbar"><span class="count"><b>${list.length}</b>개 ${view==="model"?"모델링":"소재"}</span><div class="active">${act.join("")}${(act.length||q)?`<button type="button" class="reset" id="reset">모두 해제</button>`:""}</div>
    <select class="sort" id="sort" aria-label="정렬"><option value="rec"${sort==="rec"?" selected":""}>기본순</option><option value="name"${sort==="name"?" selected":""}>이름순</option><option value="img"${sort==="img"?" selected":""}>이미지 많은순</option><option value="new"${sort==="new"?" selected":""}>최근 추가순</option></select></div>
  ${list.length?`<div class="grid">${list.slice(0,shown).map(card).join("")}</div>`:`<div class="empty">조건에 맞는 배경이 없어요.<br>태그 조합을 <b>하나라도</b>로 바꾸거나 필터를 하나 빼 보세요.</div>`}
  ${list.length>shown?`<div class="loadmore"><button type="button" class="btn" id="more">더 보기 (${list.length-shown}개 남음)</button></div>`:""}`}
function shotHits(P){return P.h.filter(([m])=>!cat||models[m].cc===cat)}
function boxes(b){let o="";for(let x=0;x<b.length;x+=4)o+=`<i class="bx" style="left:${b[x]}%;top:${b[x+1]}%;width:${b[x+2]-b[x]}%;height:${b[x+3]-b[x+1]}%"></i>`;return o}
function renderProp(){
  const P=PL[prop];const hs=shotHits(P);
  const others=propMatch(norm(P.ko)).filter(x=>x!==P);
  return `<div class="crumb"><button type="button" data-go="home">홈</button> › 소품 찾기${cat?" › "+CATS[cat]:""}</div>
  <h2 class="sec">'<em>${esc(P.ko)}</em>'가 보이는 장면</h2>
  <div class="toolbar"><span class="count"><b>${hs.length}</b>장 · 모델링 ${new Set(hs.map(h=>h[0])).size}개</span>
   <div class="active">${CORDER.map(c=>`<button type="button" class="chip" data-pcat="${c}" aria-pressed="${cat===c}">${CATS[c]}<span class="n">${P.h.filter(([m])=>models[m].cc===c).length}</span></button>`).join("")}</div>
   <button type="button" class="reset" data-go="all">소품 찾기 닫기</button></div>
  <p style="margin:-6px 0 16px;font-size:12.5px;color:var(--muted)">노란 상자가 AI가 '${esc(P.ko)}'(으)로 알아본 부분이에요. 자동 인식이라 틀린 장면이 섞여 있을 수 있어요. 비슷한 소품: ${P.syn.slice(0,4).map(esc).join(", ")}</p>
  ${hs.length?`<div class="shots">${hs.slice(0,shown).map(([m,t,c,b])=>{const u=models[m];const tl=u.tl[t];if(!tl)return"";
    return `<button type="button" class="shot" data-shot="${u.key}|${t}"><div class="thumb">${tileImg({file:`h/${u.i}_${tl[0]}.jpg`,n:u.it.hl[tl[0]],k:tl[1]},u.n)}${boxes(b)}</div><b>${esc(u.n)}</b><span>${CATS[u.cc]} · ${esc(u.it.n)}</span></button>`}).join("")}</div>`:`<div class="empty">이 분류에는 '${esc(P.ko)}'가 보이는 장면이 없어요.</div>`}
  ${hs.length>shown?`<div class="loadmore"><button type="button" class="btn" id="more">더 보기 (${hs.length-shown}장 남음)</button></div>`:""}`}
function render(keep){
  if(!keep)shown=60;
  renderNav();renderFilters();
  $("#main").innerHTML=prop!==null?renderProp():home&&!cat&&!q&&focus===null&&!GROUPS.some(g=>sel[g.k].size)?renderHome():renderList();
  try{localStorage.setItem("bgf3",JSON.stringify({mode,view,sort}))}catch(e){}
}
function setRoute(){const h=location.hash.slice(1);const c=Object.keys(SLUG).find(k=>SLUG[k]===h);if(c){cat=c;home=false}else if(h==="all"){cat=null;home=false}}

/* ---------- search suggestions ---------- */
let sIdx=-1,sOpts=[];
function suggest(){
  const v=$("#q").value.trim();const box=$("#sugg");if(!v){box.hidden=true;return}
  const w=norm(v);const tags=[];GROUPS.forEach(g=>g.order.forEach(t=>{if(norm(t).includes(w))tags.push({type:"tag",g:g.k,v:t,label:t,sub:g.label})}));
  const sets=items.filter(i=>norm(i.n).includes(w)).slice(0,6).map(i=>({type:"set",id:i.id,label:i.n,sub:CATS[i.cc]+" · 모델링 "+i.models.length}));
  const ms=models.filter(m=>norm(m.n).includes(w)).slice(0,8).map(m=>({type:"model",key:m.key,label:m.n,sub:m.it.n}));
  const pr=propMatch(w).sort((a,b)=>(b.keys[0]===w)-(a.keys[0]===w)||b.h.length-a.h.length).slice(0,4).map(x=>({type:"prop",i:x.i,label:x.ko+" 보이는 장면",sub:`스크린샷 ${x.h.length}장`}));
  sOpts=[{type:"q",label:`'${v}' 전체 검색`,sub:`${models.filter(m=>m._h.includes(w)).length}개`},...pr,...tags.slice(0,5),...sets,...ms];sIdx=-1;
  const sec=(t,arr)=>arr.length?`<h4>${t}</h4>`+arr.map(o=>`<button type="button" data-s="${sOpts.indexOf(o)}">${esc(o.label)}<small>${esc(o.sub)}</small></button>`).join(""):"";
  box.innerHTML=sec("검색",[sOpts[0]])+sec("소품으로 장면 찾기",sOpts.filter(o=>o.type==="prop"))+sec("태그로 거르기",sOpts.filter(o=>o.type==="tag"))+sec("배경 세트",sOpts.filter(o=>o.type==="set"))+sec("모델링",sOpts.filter(o=>o.type==="model"));box.hidden=false}
function pickSugg(o){$("#sugg").hidden=true;
  if(o.type==="q"){q=$("#q").value.trim();prop=null;home=false;render();return}
  if(o.type==="prop"){prop=o.i;q="";home=false;render();window.scrollTo({top:0});return}
  if(o.type==="tag"){sel[o.g].add(o.v);$("#q").value="";q="";home=false;render();return}
  if(o.type==="set"){focus=o.id;cat=items[o.id].cc;view="model";$("#q").value="";q="";home=false;render();return}
  if(o.type==="model"){openDetail(o.key)}}
$("#q").addEventListener("input",suggest);
$("#q").addEventListener("focus",suggest);
$("#q").addEventListener("keydown",e=>{const box=$("#sugg");const bs=[...box.querySelectorAll("button")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!bs.length)return;sIdx=(sIdx+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle("on",i===sIdx));return}
  if(e.key==="Enter"){e.preventDefault();if(sIdx>=0&&bs[sIdx])pickSugg(sOpts[+bs[sIdx].dataset.s]);else{box.hidden=true;const v=$("#q").value.trim();const P=propFind(norm(v));if(P){prop=P.i;q=""}else{prop=null;q=v}home=false;render();window.scrollTo({top:0})}}
  if(e.key==="Escape")box.hidden=true});
document.addEventListener("click",e=>{if(!e.target.closest(".sbox"))$("#sugg").hidden=true});

     ${!u.it?`<p style="margin:0;font-size:12.5px;color:var(--muted)">${esc(it.b)}</p>`:""}
     <div class="links"><button type="button" class="pri" data-v3="1">3D로 열기</button><a href="https://gleecompany.notion.site/${it.p}" target="_blank" rel="noopener">노션 상세 보기 ↗</a>${it.u?`<a href="${esc(it.u)}" target="_blank" rel="noopener">구매·출처 ↗</a>`:""}<a href="${nasUrl(it.nf||"")}" target="_blank" rel="noopener" title="회사 NAS 계정으로 로그인해야 열려요">🔒 NAS에서 열기</a></div>
     ${(it.nas||[]).length?`<div class="nas"><div class="set" style="margin-bottom:4px">NAS · 폴더 경로 (노션 기재)</div>${it.nas.map(x=>`<div class="nasrow"><code>${esc(x)}</code><button type="button" class="btn" data-copy="${esc(x)}">복사</button></div>`).join("")}</div>`:""}
     ${canUpload?`<div class="tools"><span>이미지가 틀렸나요?</span><button type="button" class="btn" data-up="${key}">이미지 넣기</button>${(ph.ids||[]).length?`<button type="button" class="btn" data-hide="${key}">${ph.hide?"기본 이미지 다시 보기":"기본 이미지 숨기기"}</button><button type="button" class="btn warn" data-clear="${key}">올린 이미지 지우기</button>`:""}</div>`:""}
   </div>`;
  if(hl!==null&&PL[hl]&&u.it&&p&&p.file){const mi=models.indexOf(u);const t=u.tl.findIndex(([c,k])=>p.file===`h/${u.i}_${c}.jpg`&&p.k===k);const h=PL[hl].h.find(x=>x[0]===mi&&x[1]===t);if(h)$("#dlg .big").insertAdjacentHTML("beforeend",boxes(h[3]))}
  $("#ov").hidden=false;document.body.style.overflow="hidden";$("#close").focus()}
function closeDetail(){hl=null;$("#ov").hidden=true;document.body.style.overflow="";cur=null}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeDetail()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden)closeDetail()});

/* ---------- events ---------- */
let upKey=null;
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#close")){closeDetail();return}
  const dt=t.closest("[data-dt]");if(dt){openDetail(cur,+dt.dataset.dt);return}
  const op=t.closest("[data-open]");if(op){openDetail(op.dataset.open);return}
  const pp=t.closest("[data-prop]");if(pp){prop=+pp.dataset.prop;q="";$("#q").value=PL[prop].ko;focus=null;home=false;closeDetail();render();window.scrollTo({top:0});return}
  const pc=t.closest("[data-pcat]");if(pc){cat=cat===pc.dataset.pcat?null:pc.dataset.pcat;render();return}
  const sh=t.closest("[data-shot]");if(sh){const [k,tt]=sh.dataset.shot.split("|");const ph=photos[k]||{};hl=prop;openDetail(k,(ph.hide?0:(ph.ids||[]).length)+ +tt);return}
  const go=t.closest("[data-go]");if(go){const g=go.dataset.go;focus=null;q="";prop=null;$("#q").value="";
    if(g==="home"){home=true;cat=null;GROUPS.forEach(x=>sel[x.k].clear());history.replaceState(null,"",location.pathname+location.search)}
    else if(g==="all"){home=false;cat=null;location.hash="all"}else{home=false;cat=g;location.hash=SLUG[g]}
    render();window.scrollTo({top:0});return}
  const vw=t.closest("[data-view]");if(vw){view=vw.dataset.view;if(view==="item")focus=null;render();return}
  const c=t.closest("[data-g]");if(c){const s=sel[c.dataset.g],v=c.dataset.v;s.has(v)?s.delete(v):s.add(v);home=false;render();return}
  const f=t.closest("[data-focus]");if(f){focus=+f.dataset.focus;cat=items[focus].cc;view="model";home=false;closeDetail();render();window.scrollTo({top:0});return}
  if(t.dataset.copy){const v=t.dataset.copy;try{await navigator.clipboard.writeText(v);toast("복사했어요")}catch(err){const c=t.previousElementSibling;const r=document.createRange();r.selectNodeContents(c);const s2=getSelection();s2.removeAllRanges();s2.addRange(r);toast("선택됐어요. Ctrl+C로 복사하세요")}return}
  if(t.closest("[data-v3]")){const u=findUnit(cur);const it=u.it||u;import("./viewer.js").then(m=>m.openViewer(u.n,(it.nas||[])[0]||"")).catch(()=>toast("뷰어를 불러오지 못했어요"));return}
  if(t.id==="unfocus"){focus=null;render();return}
  if(t.id==="more"){shown+=60;render(true);return}
  if(t.id==="reset"){GROUPS.forEach(g=>sel[g.k].clear());q="";$("#q").value="";render();return}
  if(t.dataset.up){upKey=t.dataset.up;$("#fileIn").value="";$("#fileIn").click();return}
  if(t.dataset.hide){const k=t.dataset.hide;const ph={...(photos[k]||{ids:[]})};ph.hide=!ph.hide;await savePhotos(k,ph);return}
  if(t.dataset.clear){const k=t.dataset.clear;
    if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="한 번 더 누르면 지워져요";return}
    for(const id of (photos[k]||{}).ids||[]){try{await assets.delete(id)}catch(err){}}
    await savePhotos(k,{ids:[],hide:false});toast("올린 이미지를 지웠어요");return}
});
$("#main").addEventListener("change",e=>{if(e.target.id==="sort"){sort=e.target.value;render()}});
$("#fileIn").addEventListener("change",async()=>{
  const files=[...$("#fileIn").files];if(!files.length||!upKey||!assets)return;
  const k=upKey;const ph={ids:[...((photos[k]||{}).ids||[])],hide:(photos[k]||{}).hide||false};toast("이미지 올리는 중…");
  for(const f of files){try{const r=await assets.upload(f);ph.ids.push(r.id)}catch(err){
    toast({too_large:"파일이 너무 커요 (20MB 이하)",unsupported_type:"PNG·JPG·WEBP·GIF만 올릴 수 있어요",quota_or_state:"저장 공간이 가득 찼어요",rate_limited:"잠시 후 다시 시도해 주세요"}[err&&err.code]||"이미지를 올리지 못했어요");return}}
  ph.hide=true;await savePhotos(k,ph);toast("이미지를 넣었어요")});
async function savePhotos(k,ph){photos[k]=ph;render(true);if(cur===k)openDetail(k);
  if(!db)return;try{await db.doc("photos/"+k).set(ph)}catch(err){toast("저장하지 못했어요. 새로고침 후 다시 시도해 주세요")}}
$("#m-and").onclick=()=>{mode="and";$("#m-and").setAttribute("aria-pressed",true);$("#m-or").setAttribute("aria-pressed",false);render()};
$("#m-or").onclick=()=>{mode="or";$("#m-or").setAttribute("aria-pressed",true);$("#m-and").setAttribute("aria-pressed",false);render()};
try{const s=JSON.parse(localStorage.getItem("bgf3")||"null");if(s){mode=s.mode||"and";view=s.view||"model";sort=s.sort||"rec";$("#m-and").setAttribute("aria-pressed",mode==="and");$("#m-or").setAttribute("aria-pressed",mode==="or")}}catch(e){}
setRoute();render();

(async()=>{
  if(!window.claude?.use)return;
  db=await claude.use("db");
  if(db){db.collection("photos").onSnapshot(snap=>{const next={};snap.docs.forEach(d=>next[d.id]=d.data());photos=next;render(true);if(cur)openDetail(cur)},()=>{})}
  assets=await claude.use("assets");canUpload=!!(assets&&db);if(canUpload){render(true);if(cur)openDetail(cur)}
})();
</script>

</body>
</html>
